<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#13243a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="KoBoTrade"><title>KoBoTrade</title><style>
body{margin:0;background:#f5f7fa;color:#13243a;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.app{max-width:480px;margin:auto;min-height:100vh;padding-bottom:75px}header{padding:24px 20px 12px;font-size:26px;font-weight:800}main{padding:0 16px}.subtitle{font-weight:800;margin:14px 4px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:0 16px;margin:10px 0}.row{padding:16px 0;border-bottom:1px solid #e5e7eb}.row:last-child{border:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.name{font-weight:800}.pct{font-weight:700}.status{margin-top:5px}.wait{color:#6b7280}.buy{color:#16845a;font-weight:800}.near{font-size:13px;color:#16845a;margin-top:4px}table{width:100%;border-collapse:collapse}th,td{padding:14px 4px;border-bottom:1px solid #e5e7eb}th{font-size:12px;color:#6b7280}th:nth-child(2),td:nth-child(2){text-align:center}th:nth-child(3),td:nth-child(3){text-align:right}.primary{width:100%;border:0;border-radius:12px;padding:13px;background:#13243a;color:#fff;font-weight:700;margin-top:14px}.danger{background:#fff;color:#b42318;border:1px solid #e0b8b2}.add{margin:14px 0}.setting-row{display:flex;flex-direction:row;flex-wrap:nowrap;justify-content:space-between;align-items:center;gap:12px;min-height:52px;border-bottom:1px solid #e5e7eb;cursor:pointer}.setting-row:last-child{border:0}.setting-label{font-weight:600;white-space:nowrap}.setting-value{color:#6b7280;text-align:right;white-space:nowrap}.chev{color:#9ca3af;margin-left:5px}.on{color:#16845a;font-weight:700}.nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:auto;background:#fff;border-top:1px solid #e5e7eb;display:grid;grid-template-columns:repeat(3,1fr);padding:8px}.nav button{border:0;background:none;color:#6b7280}.nav button.active{color:#13243a;font-weight:800}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;max-width:480px;margin:auto;background:#fff;border-radius:20px 20px 0 0;padding:20px;box-sizing:border-box}.close{float:right;border:0;background:none;font-size:22px}.sheet h2{margin-top:4px}label{display:block;font-size:13px;color:#6b7280;margin:13px 0 6px}input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;box-sizing:border-box}.switch-line{display:flex;flex-direction:row;flex-wrap:nowrap;justify-content:space-between;align-items:center;gap:12px;min-height:48px}.switch-line span{white-space:nowrap}
</style></head><body><div class="app"><header>KoBoTrade</header><main id="content"></main><nav class="nav"><button onclick="tab='home';render()">ホーム</button><button onclick="tab='holdings';render()">保有銘柄</button><button onclick="tab='settings';render()">設定</button></nav></div><div id="modal" class="modal"><div class="sheet"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div><script>
const initial={holdings:[{name:'Microsoft',shares:8,avg:466,current:498},{name:'Amazon',shares:10,avg:228.82,current:273}],rules:{down:[15,20],downShares:1,upPct:20,upShares:1,continue:true,continuePct:20,notify:true}};let state=JSON.parse(localStorage.getItem('koboState')||'null')||initial,tab='home';function save(){localStorage.setItem('koboState',JSON.stringify(state))}function pct(h){return(h.current/h.avg-1)*100}function f(n){return Number(n).toFixed(2)}function info(h){let p=pct(h),r=state.rules;if(p>=r.upPct)return[true,'買う',`+${f(r.upPct)}% 到達：${r.upShares}株`];for(let d of r.down.slice().sort((a,b)=>a-b))if(p<=-d)return[true,'買う',`-${d}% 到達：${r.downShares}株`];return[false,'待つ',`+${f(r.upPct)}%まで あと${f(r.upPct-p)}%`]}function render(){content.innerHTML=tab==='home'?home():tab==='holdings'?holdings():settings();document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('active',['home','holdings','settings'][i]===tab))}function home(){return`<div class="subtitle">今日の判定</div><div class="card">${state.holdings.map(h=>{let p=pct(h),i=info(h);return`<div class="row"><div class="top"><span class="name">${h.name}</span><span class="pct">${p>=0?'+':''}${f(p)}%</span></div><div class="status ${i[0]?'buy':'wait'}">${i[1]}</div><div class="near">${i[2]}</div></div>`}).join('')}</div>`}function holdings(){return`<div class="subtitle">保有銘柄</div><div class="card"><table><tr><th>銘柄</th><th>株数</th><th>評価損益</th></tr>${state.holdings.map((h,i)=>`<tr onclick="editHolding(${i})"><td>${h.name}</td><td>${h.shares}株</td><td>${pct(h)>=0?'+':''}${f(pct(h))}%</td></tr>`).join('')}</table></div><button class="primary add" onclick="addHolding()">＋ 銘柄を追加</button>`}function settings(){let r=state.rules;return`<div class="subtitle">◼️ 買いルール</div><div class="card"><div class="setting-row" onclick="editSetting('downShares')"><span class="setting-label">下落時の購入株数</span><span class="setting-value">${r.downShares}株 <span class="chev">›</span></span></div><div class="setting-row" onclick="editSetting('down')"><span class="setting-label">下落①</span><span class="setting-value">−${r.down[0]}% <span class="chev">›</span></span></div><div class="setting-row" onclick="editSetting('down2')"><span class="setting-label">下落②</span><span class="setting-value">−${r.down[1]??20}% <span class="chev">›</span></span></div><div class="setting-row" onclick="editSetting('upShares')"><span class="setting-label">上昇時の購入株数</span><span class="setting-value">${r.upShares}株 <span class="chev">›</span></span></div><div class="setting-row" onclick="editSetting('upPct')"><span class="setting-label">上昇購入開始</span><span class="setting-value">＋${r.upPct}% <span class="chev">›</span></span></div><div class="setting-row" onclick="editSetting('continue')"><span class="setting-label">上昇購入継続</span><span class="setting-value ${r.continue?'on':''}">${r.continue?'ON':'OFF'} <span class="chev">›</span></span></div><div class="setting-row" onclick="editSetting('continuePct')"><span class="setting-label">継続購入率</span><span class="setting-value">＋${r.continuePct}% <span class="chev">›</span></span></div></div><div class="subtitle">◼️ スマホ通知</div><div class="card"><div class="setting-row" onclick="editSetting('notify')"><span class="setting-label">通知</span><span class="setting-value ${r.notify?'on':''}">${r.notify?'ON':'OFF'} <span class="chev">›</span></span></div></div>`}function editSetting(k){let r=state.rules,t='',v='';if(k==='downShares'){t='下落時の購入株数';v=r.downShares}if(k==='down'){t='下落①';v=r.down[0]}if(k==='down2'){t='下落②';v=r.down[1]??20}if(k==='upShares'){t='上昇時の購入株数';v=r.upShares}if(k==='upPct'){t='上昇購入開始';v=r.upPct}if(k==='continuePct'){t='継続購入率';v=r.continuePct}if(k==='continue'||k==='notify'){t=k==='continue'?'上昇購入継続':'通知';modalBody.innerHTML=`<h2>${t}</h2><div class="switch-line"><span>${t}</span><input id="boolValue" type="checkbox" ${r[k]?'checked':''}></div><button class="primary" onclick="saveBool('${k}')">保存</button>`}else{modalBody.innerHTML=`<h2>${t}</h2><label>数値</label><input id="settingValue" type="number" value="${v}" min="0" step="1"><button class="primary" onclick="saveNumber('${k}')">保存</button>`}modal.classList.add('open')}function saveNumber(k){let v=Number(settingValue.value);if(!(v>0))return alert('1以上の数値を入力してください');if(k==='downShares')state.rules.downShares=v;if(k==='down')state.rules.down[0]=v;if(k==='down2'){if(state.rules.down.length<2)state.rules.down.push(v);else state.rules.down[1]=v}if(k==='upShares')state.rules.upShares=v;if(k==='upPct')state.rules.upPct=v;if(k==='continuePct')state.rules.continuePct=v;save();closeModal();render()}function saveBool(k){state.rules[k]=boolValue.checked;save();closeModal();render()}function addHolding(){modalBody.innerHTML='<h2>保有銘柄を追加</h2><label>追加銘柄</label><input id="nn"><label>追加株数</label><input id="ns" type="number" value="1"><label>追加購入価格</label><input id="np" type="number" step=".01"><button class="primary" onclick="doAdd()">追加</button>';modal.classList.add('open')}function doAdd(){let n=nn.value.trim(),s=+ns.value,p=+np.value;if(!n||s<=0||p<=0)return alert('3項目を入力してください');let h=state.holdings.find(x=>x.name.toLowerCase()===n.toLowerCase());if(h){let total=h.shares+s;h.avg=(h.avg*h.shares+p*s)/total;h.shares=total;h.current=p}else state.holdings.push({name:n,shares:s,avg:p,current:p});save();closeModal();render()}function editHolding(i){let h=state.holdings[i];modalBody.innerHTML=`<h2>${h.name}</h2><label>現在株価（試作版）</label><input id="ec" type="number" value="${h.current}"><button class="primary" onclick="upd(${i})">保存</button><button class="primary danger" onclick="del(${i})">保有銘柄から削除</button>`;modal.classList.add('open')}function upd(i){state.holdings[i].current=+ec.value||state.holdings[i].current;save();closeModal();render()}function del(i){if(confirm(state.holdings[i].name+'を削除しますか？')){state.holdings.splice(i,1);save();closeModal();render()}}function closeModal(){modal.classList.remove('open')}render();
</script></body></html>
