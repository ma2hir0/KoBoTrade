<script id="kobotrade_v181_notification">
async function kobotradeRequestNotificationPermission_v181() {
  if (!("Notification" in window)) {
    return { ok:false, state:"unsupported" };
  }
  if (Notification.permission === "granted") {
    return { ok:true, state:"granted" };
  }
  const state = await Notification.requestPermission();
  return { ok: state === "granted", state };
}
function kobotradeTestNotification_v181() {
  if (!("Notification" in window)) {
    alert("通知機能はこの環境では利用できません。");
    return;
  }
  if (Notification.permission !== "granted") {
    alert("通知許可: " + Notification.permission);
    return;
  }
  try {
    new Notification("KoBoTrade テスト通知", {
      body:"KoBoTradeの通知テストです。"
    });
  } catch(e) {
    alert("通知テスト失敗: " + e.message);
  }
}
async function kobotradeRunNotificationTest_v181() {
  const r = await kobotradeRequestNotificationPermission_v181();
  if (r.ok) {
    kobotradeTestNotification_v181();
  } else {
    alert("通知許可: " + r.state);
  }
}
</script>


<script id="kobotrade_v19_twelvedata">
async function kobotradeV19GetPrice(symbol, apiKey) {
  const url = "https://api.twelvedata.com/price?symbol=" +
    encodeURIComponent(symbol) + "&apikey=" + encodeURIComponent(apiKey);
  const res = await fetch(url);
  const data = await res.json();
  if (!res.ok || data.status === "error" || data.code) {
    throw new Error(data.message || ("HTTP " + res.status));
  }
  const price = Number(data.price);
  if (!Number.isFinite(price)) throw new Error("価格データが取得できませんでした");
  return price;
}
function kobotradeV19SaveKey(key) {
  sessionStorage.setItem("kobotrade_v19_td_key", key);
}
function kobotradeV19LoadKey() {
  return sessionStorage.getItem("kobotrade_v19_td_key") || "";
}
async function kobotradeV19RefreshPrice(symbol, outputId) {
  const out = document.getElementById(outputId);
  const key = kobotradeV19LoadKey();
  if (!key) { if(out) out.textContent="API Key未設定"; return null; }
  if(out) out.textContent="取得中…";
  try {
    const p = await kobotradeV19GetPrice(symbol, key);
    if(out) out.textContent="$"+p.toFixed(2)+"（"+new Date().toLocaleTimeString("ja-JP")+"）";
    return p;
  } catch(e) {
    if(out) out.textContent="取得失敗: "+e.message;
    return null;
  }
}
</script>
<script id="kobotrade_v191_price_bridge">
function kobotradeV191FindCurrentPriceInputs(){return Array.from(document.querySelectorAll("input")).filter(function(el){var m=[el.id||"",el.name||"",el.placeholder||"",el.getAttribute("aria-label")||""].join(" ").toLowerCase();return /現在株価|現在価格|current.?price|market.?price|currentprice/.test(m);});}
function kobotradeV191SetCurrentPrice(p){var a=kobotradeV191FindCurrentPriceInputs();if(!a.length)return false;var e=a[0],set=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,"value").set;set.call(e,String(p));e.dispatchEvent(new Event("input",{bubbles:true}));e.dispatchEvent(new Event("change",{bubbles:true}));return true;}
async function kobotradeV191UseTwelveDataForCurrentPrice(sym){var k=kobotradeV19LoadKey();if(!k){alert("Twelve Data API Keyを先に設定してください。");return;}try{var p=await kobotradeV19GetPrice(sym,k);if(!kobotradeV191SetCurrentPrice(p)){alert("株価は取得できましたが、既存の「現在株価」入力欄を認識できませんでした。\n取得価格: $"+p.toFixed(2));return;}alert("現在株価を自動入力しました。\n$"+p.toFixed(2));}catch(e){alert("株価取得失敗: "+e.message);}}
</script>

<script id="kobotrade_v192_direct_price">
window.KoBoTradeV192 = window.KoBoTradeV192 || {prices:{},latest:null};

function kobotradeV192SetPrice(symbol,price){
  const p=Number(price);
  if(!Number.isFinite(p)) throw new Error("無効な株価です");
  window.KoBoTradeV192.prices[symbol]=p;
  window.KoBoTradeV192.latest={symbol:symbol,price:p,at:Date.now()};
  window.dispatchEvent(new CustomEvent("kobotrade:price-updated",{detail:{symbol:symbol,price:p}}));
  return p;
}
function kobotradeV192GetPrice(symbol){
  return window.KoBoTradeV192.prices[symbol] ?? null;
}
async function kobotradeV192FetchAndSetPrice(symbol){
  const key=kobotradeV19LoadKey();
  if(!key){alert("Twelve Data API Keyを先に設定してください。");return null;}
  try{
    const price=await kobotradeV19GetPrice(symbol,key);
    kobotradeV192SetPrice(symbol,price);
    return price;
  }catch(e){alert("株価取得失敗: "+e.message);return null;}
}
async function kobotradeV192TestDirectPrice(symbol){
  const price=await kobotradeV192FetchAndSetPrice(symbol);
  if(price==null)return;
  alert("Twelve Data → KoBoTrade の直接受け渡し成功！\n\n銘柄: "+symbol+
        "\n現在価格: $"+price.toFixed(2)+
        "\n\n既存の判定ロジックは変更していません。");
}
</script>

function kobotradeV20SaveApiKey(k){k=(k||"").trim();if(!k)throw Error("API Keyが空です");localStorage.setItem(KoBoTradeV20.keyStorage,k);localStorage.setItem("kobotrade_twelvedata_key",k)}

<script>
const base={holdings:[
{name:"Microsoft",shares:8,avg:466,current:498,upActive:false,lastUpPurchasePct:null,downActive:false,lastDownPurchasePct:null,prevPct:null,lastDecisionPct:null,lastDecisionBuy:false,lastDecisionMsg:""},
{name:"Amazon",shares:10,avg:228.82,current:273,upActive:false,lastUpPurchasePct:null,lastDownPurchasePct:null,downActive:false,lastDownPurchasePct:null,prevPct:null,lastDecisionPct:null,lastDecisionBuy:false,lastDecisionMsg:""},
{name:"Apple",shares:6,avg:null,current:null,upActive:false,lastUpPurchasePct:null,downActive:false,lastDownPurchasePct:null,prevPct:null,lastDecisionPct:null,lastDecisionBuy:false,lastDecisionMsg:""},
{name:"Costco",shares:1,avg:null,current:null,upActive:false,lastUpPurchasePct:null,downActive:false,lastDownPurchasePct:null,prevPct:null,lastDecisionPct:null,lastDecisionBuy:false,lastDecisionMsg:""},
{name:"Alphabet",shares:7,avg:null,current:null,upActive:false,lastUpPurchasePct:null,downActive:false,lastDownPurchasePct:null,prevPct:null,lastDecisionPct:null,lastDecisionBuy:false,lastDecisionMsg:""},
{name:"Marriott",shares:7,avg:null,current:null,upActive:false,lastUpPurchasePct:null,downActive:false,lastDownPurchasePct:null,prevPct:null,lastDecisionPct:null,lastDecisionBuy:false,lastDecisionMsg:""},
{name:"Philip Morris",shares:12,avg:null,current:null,upActive:false,lastUpPurchasePct:null,downActive:false,lastDownPurchasePct:null,prevPct:null,lastDecisionPct:null,lastDecisionBuy:false,lastDecisionMsg:""}],
rules:{downPct:15,downContinue:true,downContinuePct:5,upPct:20,continue:true,continuePct:20,notify:true}};
let state=JSON.parse(localStorage.getItem("koboState")||"null")||base,tab="home";
state.rules=Object.assign({downPct:15,downContinue:true,downContinuePct:5,upPct:20,continue:true,continuePct:20,notify:true},state.rules||{});
if(Array.isArray(state.rules.down)){state.rules.downPct=state.rules.downPct??state.rules.down[0];delete state.rules.down}
state.holdings.forEach(h=>{h.upActive=!!h.upActive;h.lastUpPurchasePct=h.lastUpPurchasePct??null;h.downActive=!!h.downActive;h.lastDownPurchasePct=h.lastDownPurchasePct??null;h.prevPct=h.prevPct??null;h.lastDecisionPct=h.lastDecisionPct??null;h.lastDecisionBuy=!!h.lastDecisionBuy;h.lastDecisionMsg=h.lastDecisionMsg??""});
function save(){localStorage.setItem("koboState",JSON.stringify(state))}
function pct(h){return(Number.isFinite(h.current)&&Number.isFinite(h.avg)&&h.avg!==0)?(h.current/h.avg-1)*100:NaN} function pl(h){return(Number.isFinite(h.current)&&Number.isFinite(h.avg)&&Number.isFinite(h.shares))?(h.current-h.avg)*h.shares:NaN} function f(x){return Number(x).toFixed(2)}

function evaluate(h){
 const raw=pct(h);
 const p=Math.abs(raw)<0.0001?0:Math.round(raw*100)/100;
 const r=state.rules;
 if(h.lastDecisionPct!==null && Math.abs(p-h.lastDecisionPct)<0.0001){return{p,buy:!!h.lastDecisionBuy,msg:h.lastDecisionMsg||"待つ"}}
 let buy=false,msg="待つ";
 if(p<0){
   if(r.downContinue&&h.downActive&&h.lastDownPurchasePct!==null && p>=h.lastDownPurchasePct+r.downContinuePct-0.0001){
     h.downActive=false; h.lastDownPurchasePct=null;
   }
   if(!h.downActive){
     if((h.prevPct===null ? Math.abs(p+r.downPct)<=0.0001 : h.prevPct>-r.downPct+0.0001 && p<=-r.downPct+0.0001)){
       buy=true; msg=`−${r.downPct}%到達`;
       if(r.downContinue){h.downActive=true;h.lastDownPurchasePct=p;}
     }
   }else if(r.downContinue){
     const next=h.lastDownPurchasePct-r.downContinuePct;
     if((h.prevPct===null||h.prevPct>next) && p<=next+0.0001){
       buy=true; msg=`−${r.downContinuePct}%継続購入`; h.lastDownPurchasePct=p;
     }
   }
 }else{
   if(r.continue&&h.upActive&&h.lastUpPurchasePct!==null&&p<=h.lastUpPurchasePct-r.continuePct+0.0001){
     h.upActive=false;h.lastUpPurchasePct=null;
   }
   if(!h.upActive){
     if((h.prevPct===null||h.prevPct<r.upPct)&&p>=r.upPct-0.0001){
       buy=true;msg=`＋${r.upPct}%到達`;
       if(r.continue){h.upActive=true;h.lastUpPurchasePct=p;}
     }
   }else if(r.continue){
     const next=h.lastUpPurchasePct+r.continuePct;
     if((h.prevPct===null||h.prevPct<next)&&p>=next-0.0001){
       buy=true;msg=`＋${r.continuePct}%継続購入`;h.lastUpPurchasePct=p;
     }
   }
 }
 h.lastDecisionPct=p;h.lastDecisionBuy=buy;h.lastDecisionMsg=msg;
 return{p,buy,msg}
}
function near(h,p){
 const r=state.rules;
 if(p<0){
   if(r.downContinue&&h.downActive&&h.lastDownPurchasePct!==null){let n=h.lastDownPurchasePct-r.downContinuePct;if(p>n)return`−${f(Math.abs(n))}%まであと${f(p-n)}%`}
   let n=-r.downPct;return p>n?`−${f(r.downPct)}%まであと${f(p-n)}%`:"下落購入条件到達済み"
 }
 if(r.continue&&h.upActive&&h.lastUpPurchasePct!==null){let n=h.lastUpPurchasePct+r.continuePct;if(p<n)return`＋${f(n)}%まであと${f(n-p)}%`}
 return p<r.upPct?`＋${f(r.upPct)}%まであと${f(r.upPct-p)}%`:"上昇購入条件到達済み"
}
function home(){return`<div class="subtitle">今日の判定</div><div class="card">${state.holdings.map(h=>{let e=evaluate(h);return`<div class="row"><div class="top"><span class="name">${h.name}</span><span class="pct">${e.p>=0?"+":""}${f(e.p)}%</span></div><div class="status ${e.buy?"buy":"wait"}">${e.buy?"買う":"待つ"}</div><div class="near">${e.buy?e.msg:near(h,e.p)}</div></div>`}).join("")}</div>`}
function holdings(){return`<div class="subtitle">保有銘柄</div><div class="card"><table><tr><th>銘柄</th><th>株数</th><th>現在株価</th><th>評価損益</th></tr>${state.holdings.map((h,i)=>{const hasAvg=Number.isFinite(Number(h.avg))&&Number(h.avg)>0;const hasCurrent=Number.isFinite(Number(h.current));const shares=Number(h.shares);const q=hasAvg&&hasCurrent&&Number.isFinite(shares)?(Number(h.current)-Number(h.avg))*shares:NaN;const r=hasAvg&&hasCurrent?(Number(h.current)/Number(h.avg)-1)*100:NaN;const plText=Number.isFinite(q)?`${q>=0?"+":"-"}$${f(Math.abs(q))}<br><span class="small">${r>=0?"+":""}${f(r)}%</span>`:"取得単価未設定";return`<tr onclick="editHolding(${i})"><td>${h.name}</td><td>${h.shares}株</td><td>${hasCurrent?"$"+f(Number(h.current)):"未取得"}</td><td>${plText}</td></tr>`}).join("")}</table></div><button class="primary" onclick="kobotradeV20UpdateHoldingsPrices()">株価を自動更新</button><button class="primary" onclick="addHolding()">＋ 銘柄を追加</button>`}
function settings(){let r=state.rules;return`<div class="subtitle">◼️ 買いルール</div><div class="card">
<div class="setting-row" onclick="edit('downPct')"><span class="setting-label">下落購入開始</span><span class="setting-value">−${r.downPct}% ›</span></div>
<div class="setting-row" onclick="editBool('downContinue')"><span class="setting-label">下落購入継続</span><span class="setting-value ${r.downContinue?'on':''}">${r.downContinue?'ON':'OFF'} ›</span></div>
<div class="setting-row" onclick="edit('downContinuePct')"><span class="setting-label">下落継続率</span><span class="setting-value">−${r.downContinuePct}% ›</span></div>
<div class="setting-row" onclick="edit('upPct')"><span class="setting-label">上昇購入開始</span><span class="setting-value">＋${r.upPct}% ›</span></div>
<div class="setting-row" onclick="editBool('continue')"><span class="setting-label">上昇購入継続</span><span class="setting-value ${r.continue?'on':''}">${r.continue?'ON':'OFF'} ›</span></div>
<div class="setting-row" onclick="edit('continuePct')"><span class="setting-label">上昇継続率</span><span class="setting-value">＋${r.continuePct}% ›</span></div></div>
<div class="subtitle">◼️ スマホ通知</div><div class="card"><div class="setting-row" onclick="editBool('notify')"><span class="setting-label">通知</span><span class="setting-value ${r.notify?'on':''}">${r.notify?'ON':'OFF'} ›</span></div></div>
<div class="subtitle">◼️ 株価API</div><div class="card" id="kobotrade-v20-api-settings">
<div class="row"><b>Twelve Data API Key</b></div>
<div class="row small" id="kobotrade-v20-api-key-state">API Key：${kobotradeV20GetApiKey()?'保存済み（このiPhone）':'未設定'}</div>
<input id="kobotrade-v20-api-key-input" type="password" autocomplete="off" placeholder="Twelve Data API Key" style="width:100%;box-sizing:border-box;padding:10px">
<button class="primary" onclick="kobotradeV20SaveFromSettings()">API Keyを保存</button>
<button onclick="kobotradeV20DeleteFromSettings()">API Keyを削除</button>
</div>`}
function edit(k){let map={downPct:["下落購入開始",state.rules.downPct],downContinuePct:["下落継続率",state.rules.downContinuePct],upPct:["上昇購入開始",state.rules.upPct],continuePct:["上昇継続率",state.rules.continuePct]};let x=map[k];modalBody.innerHTML=`<h2>${x[0]}</h2><label>数値</label><input id="val" type="number" min="0.01" step="0.01" value="${x[1]}"><button class="primary" onclick="saveEdit('${k}')">保存</button>`;modal.classList.add("open")}
function saveEdit(k){let v=+val.value;if(v<=0)return alert("0より大きい数値を入力してください");state.rules[k]=v;save();closeModal();render()}
function editBool(k){modalBody.innerHTML=`<h2>${k=="continue"?"上昇購入継続":k=="downContinue"?"下落購入継続":"通知"}</h2><input id="bool" type="checkbox" ${state.rules[k]?"checked":""}><button class="primary" onclick="state.rules['${k}']=bool.checked;save();closeModal();render()">保存</button>`;modal.classList.add("open")}
function addHolding(){modalBody.innerHTML=`<h2>保有銘柄を追加</h2><label>追加銘柄</label><input id="nn"><label>追加株数</label><input id="ns" type="number" value="1"><label>追加購入価格</label><input id="np" type="number" step=".01"><button class="primary" onclick="doAdd()">追加</button>`;modal.classList.add("open")}
function doAdd(){let n=nn.value.trim(),s=+ns.value,p=+np.value;if(!n||s<=0||p<=0)return alert("3項目を入力してください");let h=state.holdings.find(x=>x.name.toLowerCase()==n.toLowerCase());if(h){let t=h.shares+s;h.avg=(h.avg*h.shares+p*s)/t;h.shares=t;h.current=p}else state.holdings.push({name:n,shares:s,avg:p,current:p,upActive:false,lastUpPurchasePct:null,downActive:false,lastDownPurchasePct:null,prevPct:null,lastDecisionPct:null,lastDecisionBuy:false,lastDecisionMsg:""});save();closeModal();render()}
function editHolding(i){let h=state.holdings[i];modalBody.innerHTML=`<h2>${h.name}</h2><div class="row">取得単価　${f(h.avg)}</div><div class="row">保有株数　${h.shares}株</div><div class="row">現在株価　<b>${Number.isFinite(h.current)?"$"+f(h.current):"未取得"}</b></div><div class="row">評価損益　${Number.isFinite(pl(h))?(pl(h)>=0?"+":"-")+"$"+f(Math.abs(pl(h)))+"（"+(pct(h)>=0?"+":"")+f(pct(h))+"%）":"取得単価未設定"}</div><p class="small">現在株価はTwelve Dataから自動取得されます。</p><button class="primary" onclick="kobotradeV20UpdateOneHolding(${i})">この銘柄の株価を更新</button><button class="primary danger" onclick="del(${i})">保有銘柄から削除</button>`;modal.classList.add("open")}
async function kobotradeV20UpdateOneHolding(i){let h=state.holdings[i];try{let symbol=kobotradeV20ResolveSymbol(h.name);let p=await kobotradeV20FetchPrice(symbol);h.current=p;h.symbol=symbol;save();closeModal();render();}catch(e){alert("株価取得失敗: "+e.message)}}
async function kobotradeV20UpdateHoldingsPrices(){
  if(!kobotradeV20GetApiKey()){
    alert("Twelve Data API Keyを先に設定してください。"); return;
  }
  let failed=[],cacheCount=0,apiCount=0;
  for(const h of state.holdings){
    try{
      const symbol=window.kobotradeV20ResolveSymbol
        ? kobotradeV20ResolveSymbol(h.name)
        : String(h.symbol||h.name||"").toUpperCase();
      const before=window.kobotradeV20GetQuoteCacheInfo
        ? kobotradeV20GetQuoteCacheInfo(symbol) : null;
      h.current=await kobotradeV20FetchPrice(symbol);
      h.symbol=symbol;
      const after=window.kobotradeV20GetQuoteCacheInfo
        ? kobotradeV20GetQuoteCacheInfo(symbol) : null;
      if(before && after && before.savedAt===after.savedAt) cacheCount++;
      else apiCount++;
    }catch(e){failed.push(h.name);}
  }
  save(); render();
  if(failed.length){
    alert("取得できなかった銘柄: "+failed.join(", ")+
      "\n\nキャッシュ使用: "+cacheCount+"銘柄"+
      "\nTwelve Data取得: "+apiCount+"銘柄");
    return;
  }
  const nextTimes=state.holdings.map(h=>{
    const symbol=h.symbol||(window.kobotradeV20ResolveSymbol
      ? kobotradeV20ResolveSymbol(h.name):String(h.name||"").toUpperCase());
    const info=window.kobotradeV20GetQuoteCacheInfo
      ? kobotradeV20GetQuoteCacheInfo(symbol):null;
    return info?info.expiresAt:0;
  }).filter(Boolean);
  const next=nextTimes.length
    ? new Date(Math.min.apply(null,nextTimes)).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})
    : "未定";
  alert("株価更新完了\n\n"+
    "キャッシュ使用: "+cacheCount+"銘柄\n"+
    "Twelve Data取得: "+apiCount+"銘柄\n\n"+
    "次回API取得可能: "+next);
}
function render(){content.innerHTML=tab=="home"?home():tab=="holdings"?holdings():tab=="settings"?settings():tests();document.querySelectorAll(".nav button").forEach((b,i)=>b.classList.toggle("active",["home","holdings","settings","tests"][i]==tab))}
render();

/* KoBoTrade v1.8 notification helpers */
async function kobotradeRequestNotificationPermission() {
  if (!("Notification" in window)) return {ok:false,state:"unsupported"};
  if (Notification.permission === "granted") return {ok:true,state:"granted"};
  const permission = await Notification.requestPermission();
  return {ok:permission === "granted",state:permission};
}
function kobotradeShowNotification(title, body) {
  if (!("Notification" in window) || Notification.permission !== "granted") return false;
  try { new Notification(title,{body}); return true; }
  catch(e) { console.warn("KoBoTrade notification failed:",e); return false; }
}
function kobotradeTestNotification() {
  return kobotradeShowNotification("KoBoTrade テスト通知","通知機能は正常に動作しています。");
}

<script id="kobotrade-v20-15min-cache">
(function(){
  const TTL=15*60*1000, raw=window.kobotradeV20FetchPrice;
  if(!raw) return;
  window.kobotradeV20FetchPrice=async function(symbol){
    symbol=String(symbol||"").toUpperCase();
    const key="kobotrade_v20_quote_cache_"+symbol, now=Date.now();
    try{
      const c=JSON.parse(localStorage.getItem(key)||"null");
      if(c && Number.isFinite(+c.price) && Number.isFinite(+c.savedAt) &&
         now-(+c.savedAt)<TTL){
        if(window.KoBoTradeV20){
          KoBoTradeV20.prices[symbol]=+c.price;
          KoBoTradeV20.updatedAt[symbol]=+c.savedAt;
        }
        window.KoBoTradeV20LastFetch={symbol,price:+c.price,fromCache:true,savedAt:+c.savedAt};
        return +c.price;
      }
    }catch(e){}
    const price=await raw(symbol), savedAt=Date.now();
    try{localStorage.setItem(key,JSON.stringify({price:+price,savedAt}));}catch(e){}
    window.KoBoTradeV20LastFetch={symbol,price:+price,fromCache:false,savedAt};
    return +price;
  };
  window.kobotradeV20GetQuoteCacheInfo=function(symbol){
    try{
      const c=JSON.parse(localStorage.getItem("kobotrade_v20_quote_cache_"+String(symbol||"").toUpperCase())||"null");
      if(!c || !Number.isFinite(+c.savedAt)) return null;
      return {price:+c.price,savedAt:+c.savedAt,expiresAt:+c.savedAt+TTL,
              remainingMs:Math.max(0,+c.savedAt+TTL-Date.now())};
    }catch(e){return null;}
  };
  window.kobotradeV20ClearQuoteCache=function(){
    Object.keys(localStorage).forEach(k=>{
      if(k.indexOf("kobotrade_v20_quote_cache_")===0) localStorage.removeItem(k);
    });
  };
})();
</script><script id="kobotrade-v20-cache-status-script">
(function(){
function update(){
 const el=document.getElementById("kobotrade-v20-cache-status");
 if(!el||!window.state||!Array.isArray(state.holdings)) return;
 el.innerHTML=state.holdings.map(function(h){
  const symbol=h.symbol||(window.kobotradeV20ResolveSymbol
   ? kobotradeV20ResolveSymbol(h.name):String(h.name||"").toUpperCase());
  const i=window.kobotradeV20GetQuoteCacheInfo
   ? kobotradeV20GetQuoteCacheInfo(symbol):null;
  if(!i) return h.name+"："+symbol+"　未取得";
  const t=new Date(i.savedAt).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
  if(i.remainingMs>0){
   const min=Math.floor(i.remainingMs/60000), sec=Math.floor((i.remainingMs%60000)/1000);
   return h.name+"："+symbol+"　キャッシュ　"+t+"取得／あと"+min+"分"+String(sec).padStart(2,"0")+"秒";
  }
  return h.name+"："+symbol+"　次回API取得可能";
 }).join("<br>");
}
document.addEventListener("DOMContentLoaded",function(){update();setInterval(update,1000);});
})();

window.closeModal=function(){
  var m=document.getElementById("modal")||document.querySelector(".modal");
  if(m){
    m.classList.remove("open","active","show");
    // 開くときにCSSの .modal.open が効かなくなるため、display/visibility/opacity の
    // inline固定は残さず、class制御に戻す。
    m.style.removeProperty("display");
    m.style.removeProperty("visibility");
    m.style.removeProperty("opacity");
    m.setAttribute("aria-hidden","true");
  }
  document.querySelectorAll(".modal-backdrop,.modal-overlay,.overlay").forEach(function(e){
    e.classList.remove("open","active","show");
    e.style.display="none";
  });
  document.body.classList.remove("modal-open","no-scroll");
  document.body.style.overflow="";
};
