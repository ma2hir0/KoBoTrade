<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="KoBoTrade">
<title>KoBoTrade</title>
<style>
body{margin:0;background:#f5f7fa;color:#13243a;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
.app{max-width:480px;margin:auto;min-height:100vh;padding-bottom:70px}header{padding:24px 20px 12px;font-size:26px;font-weight:800}
main{padding:0 16px}.subtitle{font-weight:800;margin:14px 4px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:0 16px;margin:10px 0}
.row{padding:16px 0;border-bottom:1px solid #e5e7eb}.row:last-child{border:0}.top{display:flex;justify-content:space-between}.name{font-weight:800}.pct{font-weight:700}
.status{margin-top:5px}.wait{color:#6b7280}.buy{color:#16845a;font-weight:800}.near{font-size:13px;color:#16845a;margin-top:4px}
table{width:100%;border-collapse:collapse}th,td{padding:14px 4px;border-bottom:1px solid #e5e7eb}th{font-size:12px;color:#6b7280}th:nth-child(2),td:nth-child(2){text-align:center}th:nth-child(3),td:nth-child(3){text-align:right}
.primary{width:100%;border:0;border-radius:12px;padding:13px;background:#13243a;color:#fff;font-weight:700;margin-top:14px}.danger{background:#fff;color:#b42318;border:1px solid #e0b8b2}
.setting-row{display:flex;justify-content:space-between;align-items:center;min-height:52px;border-bottom:1px solid #e5e7eb}.setting-row:last-child{border:0}.setting-label,.setting-value{white-space:nowrap}.setting-label{font-weight:600}.setting-value{color:#6b7280}.on{color:#16845a;font-weight:700}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:auto;background:#fff;border-top:1px solid #e5e7eb;display:grid;grid-template-columns:repeat(4,1fr);padding:8px}.nav button{border:0;background:none;color:#6b7280}.nav button.active{color:#13243a;font-weight:800}
.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;max-width:480px;margin:auto;background:#fff;border-radius:20px 20px 0 0;padding:20px;box-sizing:border-box}.close{float:right;border:0;background:none;font-size:22px}
label{display:block;font-size:13px;color:#6b7280;margin:13px 0 6px}input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;box-sizing:border-box}
</style></head><body><div class="app"><header>KoBoTrade</header><main id="content"></main>
<nav class="nav"><button onclick="tab='home';render()">ホーム</button><button onclick="tab='holdings';render()">保有銘柄</button><button onclick="tab='settings';render()">設定</button><button onclick="tab='tests';render()">テスト</button></nav></div>
<div id="modal" class="modal"><div class="sheet"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div>
<script>
const base={holdings:[
{name:"Microsoft",shares:8,avg:466,current:498,upActive:false,lastUpPurchasePct:null,downActive:false,lastDownPurchasePct:null,prevPct:null},
{name:"Amazon",shares:10,avg:228.82,current:273,upActive:false,lastUpPurchasePct:null,downActive:false,lastDownPurchasePct:null,prevPct:null}],
rules:{downPct:15,downContinue:true,downContinuePct:5,upPct:20,continue:true,continuePct:20,notify:true}};
let state=JSON.parse(localStorage.getItem("koboState")||"null")||base,tab="home";
state.rules=Object.assign({downPct:15,downContinue:true,downContinuePct:5,upPct:20,continue:true,continuePct:20,notify:true},state.rules||{});
if(Array.isArray(state.rules.down)){state.rules.downPct=state.rules.downPct??state.rules.down[0];delete state.rules.down}
state.holdings.forEach(h=>{h.upActive=!!h.upActive;h.lastUpPurchasePct=h.lastUpPurchasePct??null;h.downActive=!!h.downActive;h.lastDownPurchasePct=h.lastDownPurchasePct??null;h.prevPct=h.prevPct??null});
function save(){localStorage.setItem("koboState",JSON.stringify(state))}
function pct(h){return(h.current/h.avg-1)*100} function f(x){return Number(x).toFixed(2)}

function evaluate(h){
 const raw=pct(h);
 const p=Math.abs(raw)<0.0001?0:Math.round(raw*100)/100;
 const r=state.rules;
 let buy=false,msg="待つ";
 if(p<0){
   if(r.downContinue&&h.downActive&&h.lastDownPurchasePct!==null && p>=h.lastDownPurchasePct+r.downContinuePct-0.0001){
     h.downActive=false; h.lastDownPurchasePct=null;
   }
   if(!h.downActive){
     if((h.prevPct===null||h.prevPct>-r.downPct) && p<=-r.downPct+0.0001){
       buy=true; msg=`−${r.downPct}%到達`;
       if(r.downContinue){h.downActive=true;h.lastDownPurchasePct=p;}
     }
   }else if(r.downContinue){
     const next=h.lastDownPurchasePct-r.downContinuePct;
     if((h.prevPct===null||h.prevPct>next) && p<=next+0.0001){
       buy=true; msg=`−${r.downContinuePct}%継続購入`; h.lastDownPurchasePct=p;
     }
   }
 }else{
   if(r.continue&&h.upActive&&h.lastUpPurchasePct!==null&&p<=h.lastUpPurchasePct-r.continuePct+0.0001){
     h.upActive=false;h.lastUpPurchasePct=null;
   }
   if(!h.upActive){
     if((h.prevPct===null||h.prevPct<r.upPct)&&p>=r.upPct-0.0001){
       buy=true;msg=`＋${r.upPct}%到達`;
       if(r.continue){h.upActive=true;h.lastUpPurchasePct=p;}
     }
   }else if(r.continue){
     const next=h.lastUpPurchasePct+r.continuePct;
     if((h.prevPct===null||h.prevPct<next)&&p>=next-0.0001){
       buy=true;msg=`＋${r.continuePct}%継続購入`;h.lastUpPurchasePct=p;
     }
   }
 }
 return{p,buy,msg}
}
function near(h,p){
 const r=state.rules;
 if(p<0){
   if(r.downContinue&&h.downActive&&h.lastDownPurchasePct!==null){let n=h.lastDownPurchasePct-r.downContinuePct;if(p>n)return`−${f(Math.abs(n))}%まであと${f(p-n)}%`}
   let n=-r.downPct;return p>n?`−${f(r.downPct)}%まであと${f(p-n)}%`:"下落購入条件到達済み"
 }
 if(r.continue&&h.upActive&&h.lastUpPurchasePct!==null){let n=h.lastUpPurchasePct+r.continuePct;if(p<n)return`＋${f(n)}%まであと${f(n-p)}%`}
 return p<r.upPct?`＋${f(r.upPct)}%まであと${f(r.upPct-p)}%`:"上昇購入条件到達済み"
}
function home(){return`<div class="subtitle">今日の判定</div><div class="card">${state.holdings.map(h=>{let e=evaluate(h);return`<div class="row"><div class="top"><span class="name">${h.name}</span><span class="pct">${e.p>=0?"+":""}${f(e.p)}%</span></div><div class="status ${e.buy?"buy":"wait"}">${e.buy?"買う":"待つ"}</div><div class="near">${e.buy?e.msg:near(h,e.p)}</div></div>`}).join("")}</div>`}
function holdings(){return`<div class="subtitle">保有銘柄</div><div class="card"><table><tr><th>銘柄</th><th>株数</th><th>評価損益</th></tr>${state.holdings.map((h,i)=>`<tr onclick="editHolding(${i})"><td>${h.name}</td><td>${h.shares}株</td><td>${pct(h)>=0?"+":""}${f(pct(h))}%</td></tr>`).join("")}</table></div><button class="primary" onclick="addHolding()">＋ 銘柄を追加</button>`}
function settings(){let r=state.rules;return`<div class="subtitle">◼️ 買いルール</div><div class="card">
<div class="setting-row" onclick="edit('downPct')"><span class="setting-label">下落購入開始</span><span class="setting-value">−${r.downPct}% ›</span></div>
<div class="setting-row" onclick="editBool('downContinue')"><span class="setting-label">下落購入継続</span><span class="setting-value ${r.downContinue?'on':''}">${r.downContinue?'ON':'OFF'} ›</span></div>
<div class="setting-row" onclick="edit('downContinuePct')"><span class="setting-label">下落継続率</span><span class="setting-value">−${r.downContinuePct}% ›</span></div>
<div class="setting-row" onclick="edit('upPct')"><span class="setting-label">上昇購入開始</span><span class="setting-value">＋${r.upPct}% ›</span></div>
<div class="setting-row" onclick="editBool('continue')"><span class="setting-label">上昇購入継続</span><span class="setting-value ${r.continue?'on':''}">${r.continue?'ON':'OFF'} ›</span></div>
<div class="setting-row" onclick="edit('continuePct')"><span class="setting-label">上昇継続率</span><span class="setting-value">＋${r.continuePct}% ›</span></div></div>
<div class="subtitle">◼️ スマホ通知</div><div class="card"><div class="setting-row" onclick="editBool('notify')"><span class="setting-label">通知</span><span class="setting-value ${r.notify?'on':''}">${r.notify?'ON':'OFF'} ›</span></div></div>`}
function edit(k){let map={downPct:["下落購入開始",state.rules.downPct],downContinuePct:["下落継続率",state.rules.downContinuePct],upPct:["上昇購入開始",state.rules.upPct],continuePct:["上昇継続率",state.rules.continuePct]};let x=map[k];modalBody.innerHTML=`<h2>${x[0]}</h2><label>数値</label><input id="val" type="number" min="0.01" step="0.01" value="${x[1]}"><button class="primary" onclick="saveEdit('${k}')">保存</button>`;modal.classList.add("open")}
function saveEdit(k){let v=+val.value;if(v<=0)return alert("0より大きい数値を入力してください");state.rules[k]=v;save();closeModal();render()}
function editBool(k){modalBody.innerHTML=`<h2>${k=="continue"?"上昇購入継続":k=="downContinue"?"下落購入継続":"通知"}</h2><input id="bool" type="checkbox" ${state.rules[k]?"checked":""}><button class="primary" onclick="state.rules['${k}']=bool.checked;save();closeModal();render()">保存</button>`;modal.classList.add("open")}
function addHolding(){modalBody.innerHTML=`<h2>保有銘柄を追加</h2><label>追加銘柄</label><input id="nn"><label>追加株数</label><input id="ns" type="number" value="1"><label>追加購入価格</label><input id="np" type="number" step=".01"><button class="primary" onclick="doAdd()">追加</button>`;modal.classList.add("open")}
function doAdd(){let n=nn.value.trim(),s=+ns.value,p=+np.value;if(!n||s<=0||p<=0)return alert("3項目を入力してください");let h=state.holdings.find(x=>x.name.toLowerCase()==n.toLowerCase());if(h){let t=h.shares+s;h.avg=(h.avg*h.shares+p*s)/t;h.shares=t;h.current=p}else state.holdings.push({name:n,shares:s,avg:p,current:p,upActive:false,lastUpPurchasePct:null,downActive:false,lastDownPurchasePct:null,prevPct:null});save();closeModal();render()}
function editHolding(i){let h=state.holdings[i],e=evaluate(h);modalBody.innerHTML=`<h2>${h.name}</h2><div class="row">取得単価　${f(h.avg)}</div><div class="row">保有株数　${h.shares}株</div><div class="row">評価損益　${pct(h)>=0?"+":""}${f(pct(h))}%</div><label>現在株価</label><input id="ec" type="number" value="${h.current}"><button class="primary" onclick="upd(${i})">保存</button><button class="primary danger" onclick="del(${i})">保有銘柄から削除</button>`;modal.classList.add("open")} 
function upd(i){let h=state.holdings[i],v=+ec.value;if(v<=0)return alert("1以上の株価を入力してください");h.prevPct=pct(h);h.current=v;save();closeModal();render()}
function del(i){if(confirm(state.holdings[i].name+"を削除しますか？")){state.holdings.splice(i,1);save();closeModal();render()}}
function closeModal(){modal.classList.remove("open")}

function tests(){return`<div class="subtitle">開発用：自動テスト</div><div class="card"><div class="row">下落・上昇の判定ロジックを自動検証します。通常の保有銘柄・設定データは変更しません。</div></div><button class="primary" onclick="runAutoTests()">自動テストを実行</button><div id="testResults" style="margin-top:12px"></div>`}
function runAutoTests(){
 const original=JSON.parse(JSON.stringify(state)),rows=[];
 const rules={downPct:15,downContinue:true,downContinuePct:5,upPct:20,continue:true,continuePct:20,notify:true};
 const mk=p=>({name:"TEST",shares:1,avg:466,current:466*(1+p/100),upActive:false,lastUpPurchasePct:null,downActive:false,lastDownPurchasePct:null,prevPct:null});
 const check=(name,a,e)=>rows.push({name,a,e,ok:a===e});
 function fresh(p){state={holdings:[],rules:JSON.parse(JSON.stringify(rules))};return evaluate(mk(p)).msg}
 [[-14.99,"待つ"],[-15,"−15%到達"],[-15.01,"待つ"]].forEach(([p,e])=>check(`下落初回 ${p}%`,fresh(p),e));
 state={holdings:[],rules:JSON.parse(JSON.stringify(rules))};let h=mk(-15),e=evaluate(h);check("下落 −15%初回",e.msg,"−15%到達");h.prevPct=-15;h.current=466*.8;e=evaluate(h);check("下落 −20%継続",e.msg,"−5%継続購入");h.prevPct=-20;h.current=466*.75;e=evaluate(h);check("下落 −25%継続",e.msg,"−5%継続購入");h.prevPct=-25;h.current=466*.77;e=evaluate(h);check("下落 −23%押し目",e.msg,"待つ");h.prevPct=-23;h.current=466*.75;e=evaluate(h);check("下落 −25%再到達",e.msg,"待つ");
 state={holdings:[],rules:JSON.parse(JSON.stringify(rules))};h=mk(-15);e=evaluate(h);h.prevPct=-15;h.current=466*.8;e=evaluate(h);h.prevPct=-20;h.current=466*.85;e=evaluate(h);check("下落 −15%まで回復で待つ",e.msg,"待つ");
 state.rules.downContinue=false;h=mk(-15);e=evaluate(h);check("下落継続OFF −15%",e.msg,"−15%到達");h.prevPct=-15;h.current=466*.8;e=evaluate(h);check("下落継続OFF −20%",e.msg,"待つ");
 state={holdings:[],rules:JSON.parse(JSON.stringify(rules))};h=mk(20);e=evaluate(h);check("上昇 ＋20%初回",e.msg,"＋20%到達");h.prevPct=20;h.current=466*1.4;e=evaluate(h);check("上昇 ＋40%継続",e.msg,"＋20%継続購入");h.prevPct=40;h.current=466*1.3;e=evaluate(h);check("上昇 ＋30%押し目",e.msg,"待つ");h.prevPct=30;h.current=466*1.4;e=evaluate(h);check("上昇 ＋40%再到達",e.msg,"待つ");h.prevPct=40;h.current=466*1.6;e=evaluate(h);check("上昇 ＋60%継続",e.msg,"＋20%継続購入");
 state={holdings:[],rules:JSON.parse(JSON.stringify(rules))};state.rules.continuePct=10;h=mk(20);e=evaluate(h);check("上昇率変更 ＋20%",e.msg,"＋20%到達");h.prevPct=20;h.current=466*1.3;e=evaluate(h);check("上昇率変更 ＋30%",e.msg,"＋10%継続購入");
 state=original;const ok=rows.filter(x=>x.ok).length,ng=rows.length-ok;document.getElementById("testResults").innerHTML=`<div class="card"><div class="row"><b>自動テスト結果</b><br>OK ${ok} / NG ${ng} / 全${rows.length}件</div>${rows.map(x=>`<div class="row"><span class="${x.ok?"buy":"wait"}">${x.ok?"OK":"NG"}</span> ${x.name}<br><span class="small">実際：${x.a} / 期待：${x.e}</span></div>`).join("")}</div>`
}
function render(){content.innerHTML=tab=="home"?home():tab=="holdings"?holdings():tab=="settings"?settings():tests();document.querySelectorAll(".nav button").forEach((b,i)=>b.classList.toggle("active",["home","holdings","settings","tests"][i]==tab))}
render();
</script></body></html>
